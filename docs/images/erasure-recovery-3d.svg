<title id="title">Seven erasures in a three-dimensional parity code</title>
<desc id="desc">Five 5 by 5 slices show all 125 transmitted cells. Seven red cells labeled by linear index are erased. A blue row in the z equals 1 slice shows how cell 42 is recovered as the XOR of four known cells.</desc>
