<text x="450" y="145" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#075985">Horizontal check (y = 1)</text>
<text x="450" y="173" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#0c4a6e">0 XOR 1 XOR 1 XOR 0 XOR 0 = 0</text>
<text x="450" y="199" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">Two flips cancel: this line passes.</text>
<rect x="450" y="219" width="345" height="1" fill="#e2e8f0"/>
<text x="450" y="254" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#92400e">Vertical checks (x = 1, 2)</text>
<text x="450" y="282" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#78350f">Each column has one 1: syndrome = 1.</text>
<text x="450" y="309" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">Perpendicular lines reveal the errors.</text>
<text x="450" y="342" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#64748b">The two z-axis checks fail as well.</text>
<text x="35" y="426" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#64748b">The diagram shows the error mask, not the transmitted data bits. Valid codeword parity cancels out of every syndrome.</text>
</svg>
