<svg xmlns="http://www.w3.org/2000/svg" width="850" height="440" viewBox="0 0 850 440" role="img" aria-labelledby="title desc">
<title id="title">Two bit flips in one parity slice</title>
<desc id="desc">An error mask on a five by five z slice has ones at x equals 1 and x equals 2 on row y equals 1. Their XOR makes the horizontal parity check zero, while each vertical check is one.</desc>
<rect width="850" height="440" rx="20" fill="#f8fafc"/>
<rect x="1" y="1" width="848" height="438" rx="19" fill="none" stroke="#cbd5e1" stroke-width="2"/>
<text x="35" y="48" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#0f172a">Two flips, one passing line check</text>
<text x="35" y="78" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#475569">Error mask e on one fixed z slice: 1 means a flipped bit; 0 means unchanged.</text>
<rect x="35" y="105" width="370" height="300" rx="14" fill="white" stroke="#dbe4ee" stroke-width="2"/>
<rect x="430" y="105" width="385" height="300" rx="14" fill="white" stroke="#dbe4ee" stroke-width="2"/>
<text x="90" y="139" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#334155">x →</text>
<text x="48" y="177" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#334155">y ↓</text>
<rect x="148" y="168" width="7" height="188" rx="3" fill="#d97706"/>
<rect x="200" y="168" width="7" height="188" rx="3" fill="#d97706"/>
<rect x="100" y="217" width="208" height="7" rx="3" fill="#0284c7"/>
